<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DirPlayer - Experimental Shockwave player</title>
    <style>
      html, body, #movie { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0f14; }
      /* DirPlayer inserts two unsized wrappers above its percentage-height stage. */
      #movie > [data-dirplayer-mount], #movie > [data-dirplayer-mount] > div { width: 100%; height: 100%; }
      #movie > .libreshockwave-canvas { display: block; width: 100%; height: 100%; outline: none; }
      #error { position: absolute; inset: 0; box-sizing: border-box; overflow: auto; color: #fff; background: #0b0f14; font: 16px sans-serif; padding: 20px; }
    </style>
  </head>
  <body>
    <div id="movie"></div>
    <div id="error" hidden></div>
    <script src="/shockwave-volume.js"></script>
    <script src="/shockwave-playback.js"></script>
    <script src="/shockwave-player.js"></script>
  </body>
</html>
